function visual(){document.body.classList.toggle('night',!!state.settings?.nightVision);$('#nightBtn').classList.toggle('active',!!state.settings?.nightVision);$('#themeColor').content=state.settings?.nightVision?'#000000':'#07111f'}function equip(){let h=state.equipment.map(e=>`<option value="${esc(e.id)}" ${e.id===state.selectedEquipment?'selected':''}>${esc(e.name)}</option>`).join('');$('#equipmentSelect').innerHTML=h;$('#modalEquipment').innerHTML=state.equipment.map(e=>`<option value="${esc(e.id)}">${esc(e.name)}</option>`).join('')}function tabs(){$('#projectTabs').innerHTML=Object.entries(DATA.projects).map(([id,p])=>`<button class="project-tab ${id===state.selectedProject?'active':''}" data-project="${id}"><strong>${esc(p.title)}</strong><span>${p.items.length} objects</span></button>`).join('');$$('.project-tab').forEach(b=>b.onclick=()=>{state.selectedProject=b.dataset.project;filters={season:'전체',difficulty:'전체',unobserved:false,search:''};$('#search').value='';save();reset();render()});$('#projectDesc').textContent=project().description}function list(){let q=filters.search.trim().toLowerCase();return items().filter(i=>(filters.season==='전체'||i.season.includes(filters.season))&&(filters.difficulty==='전체'||dif(i)===filters.difficulty)&&(!filters.unobserved||!seen(state.selectedProject,i.id))&&(!q||[i.label,i.name,i.type,i.season,i.difficulty,i.scopeDifficulty,i.warning,i.highlight].filter(Boolean).join(' ').toLowerCase().includes(q)))}function stats(){let it=items(),d=it.filter(i=>seen(state.selectedProject,i.id)).length,u=it.filter(i=>any(state.selectedProject,i.id)).length,total=Object.values(DATA.projects).reduce((a,p)=>a+p.items.length,0),da=0;for(let[pid,p]of Object.entries(DATA.projects))da+=p.items.filter(i=>seen(pid,i.id)).length;$('#projectCount').textContent=`${d}/${it.length}`;$('#projectBar').style.width=d/it.length*100+'%';$('#allProjectCount').textContent=`${da}/${total}`;$('#allProjectBar').style.width=da/total*100+'%';$('#uniqueCount').tex function openObs(id){currentItem=items().find(i=>i.id===id);$('#modalTitle').textContent=currentItem.label+(currentItem.name?' · '+currentItem.name:'');$('#modalMeta').textContent=[currentItem.type,currentItem.season,'현재 난이도 '+dif(currentItem)].join(' · ');$('#starExtra').classList.toggle('show',state.selectedProject==='stars');$('#modalEquipment').value=state.selectedEquipment;loadFields();$('#obsModal').classList.add('open')}function loadFields(){let r=ob(state.selectedProject,currentItem.id,$('#modalEquipment').value)||{};$('#observedCheck').checked=!!r.observed;$('#obsDate').value=r.date||'';$('#obsLocation').value=r.location||'';$('#obsPower').value=r.power||'';$('#obsNote').value=r.note||'';$('#splitCheck').checked=!!r.split;$('#components').value=r.components||'';$('#colorNote').value=r.color||''}function close(id){$(id).classList.remove('open')}$('#modalEquipment').onchange=loadFields;$('#closeObsBtn').onclick=()=>close('#obsModal');$('#obsModal').onclick=e=>{if(e.target===$('#obsModal'))close('#obsModal')};$('#saveObsBtn').onclick=()=>{let pid=state.selectedProject,eid=$('#modalEquipment').value,id=currentItem.id;state.observations[pid]??={};state.observations[pid][id]??={};state.observations[pid][id][eid]={observed:$('#observedCheck').checked,date:$('#obsDate').value,location:$('#obsLocation').value.trim(),power:$('#obsPower').value.trim(),note:$('#obsNote').value.trim(),split:$('#splitCheck').checked,components:$('#components').value.trim(),color:$('#colorNote').value.trim()};save();close('#obsModal');render()};$('#deleteObsBtn').onclick=()=>{let pid=state.selectedProject,eid=$('#modalEquipment').value,id=currentItem.id;if(state.observations?.[pid]?.[id]?.[eid])delete state.observations[pid][id][eid];save();loadFields();render()};$('#equipmentSelect').onchange=e=>{state.selectedEquipment=e.target.value;save();render()};$('#nightBtn').onclick=()=>{state.settings??={};state.settings.nightVision=!state.settings.nightVision;save();visual()};$$('[data-kind]').
